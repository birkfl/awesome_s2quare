<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>awesome_s2quare</title><meta name="description" content="An open, curated reading list for quantitative MRI and the S2quare project."><link rel="stylesheet" href="style.css"></head><body><main><p class="eyebrow">OPEN READING LIST</p><h1>awesome_s2quare</h1><p>An open, curated reading list for quantitative MRI and the S2quare project.</p><label for="search">Search papers</label><input id="search" type="search" placeholder="Title, author, topic..."><p id="result-count" aria-live="polite">0 papers</p><p class="empty">No papers have been added yet. Add papers to the <code>paper</code> Zotero collection.</p></main><script>const input=document.querySelector('#search');const cards=[...document.querySelectorAll('.paper')];const count=document.querySelector('#result-count');input?.addEventListener('input',()=>{const query=input.value.toLowerCase();let visible=0;cards.forEach(card=>{const match=card.dataset.search.toLowerCase().includes(query);card.hidden=!match;if(match)visible++});count.textContent=visible+' papers';});</script></body></html>
